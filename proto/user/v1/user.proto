    syntax = "proto3";

    package user.v1;

    option go_package = "github.com/makoto-developer/strata-sample-platform/proto/user/v1;userv1";

    // UserService は user ドメインの gRPC API。
    service UserService {
      // ユーザーを 1 件取得する
  rpc GetUser(GetUserRequest) returns (GetUserReply);
  // ユーザーを一覧する
  rpc ListUsers(ListUsersRequest) returns (ListUsersReply);
  // ユーザーを作成する
  rpc CreateUser(CreateUserRequest) returns (CreateUserReply);
  // プロフィールを更新する
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileReply);
  // ユーザーを無効化する
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserReply);
    }

    message GetUserRequest {
  string id = 1;
  string actor_id = 2;
}

message GetUserReply {
  string id = 1;
  string status = 2;
}

message ListUsersRequest {
  string id = 1;
  string actor_id = 2;
}

message ListUsersReply {
  string id = 1;
  string status = 2;
}

message CreateUserRequest {
  string id = 1;
  string actor_id = 2;
}

message CreateUserReply {
  string id = 1;
  string status = 2;
}

message UpdateProfileRequest {
  string id = 1;
  string actor_id = 2;
}

message UpdateProfileReply {
  string id = 1;
  string status = 2;
}

message DeactivateUserRequest {
  string id = 1;
  string actor_id = 2;
}

message DeactivateUserReply {
  string id = 1;
  string status = 2;
}
